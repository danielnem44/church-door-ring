<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Door sign – print me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#2A2A22; --ink-2:#4A4A3F; --accent:#2F482B; --dark:#213520; --tan:#C8B99E; --cream:#FAF3ED; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #E6DFD3; font-family: "Jost", system-ui, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { max-width: 148mm; margin: 16px auto; padding: 0 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px; }
    .toolbar button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 18px; border: none; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
    .page { width: 148mm; margin: 0 auto 32px; }
    .sheet { width: 148mm; height: 105mm; background: var(--cream); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    .band { background: var(--tan); display: flex; align-items: center; gap: 3mm; padding: 2mm 6mm; }
    .band img { width: 14mm; height: 14mm; border-radius: 50%; display: block; }
    .church { font-size: 10pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dark); }
    .body { flex: 1; display: flex; align-items: center; gap: 6mm; padding: 3mm 7mm; }
    .body img.qr { width: 55mm; height: 55mm; flex-shrink: 0; border: 2px solid var(--accent); border-radius: 3mm; padding: 2mm; background: #fff; display: block; }
    h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 21pt; line-height: 1.05; color: var(--dark); }
    h1 .en { display: block; font-size: 12pt; color: var(--ink-2); margin-top: 1.5mm; }
    .sub { margin: 3mm 0 0; font-size: 9pt; line-height: 1.35; color: var(--ink-2); }
    .foot { background: var(--accent); color: var(--cream); display: flex; justify-content: space-between; align-items: center; padding: 2.5mm 7mm; font-size: 8pt; }
    .phone { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 13pt; letter-spacing: .02em; }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .toolbar { display: none; }
      .page { margin: 0; }
      .sheet { box-shadow: none; outline: 0.3mm dashed #999; outline-offset: 0; }
    }
    @media screen and (max-width: 600px) {
      .page { zoom: .6; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print / Save as PDF</button>
    <span>Small sign (148 × 105 mm). Prints on A4, cut along the dashed line. Print at 100% / "Actual size".</span>
  </div>

  <div class="page">
    <main class="sheet">
      <div class="band">
        <img src="/logo.png" alt="">
        <div class="church" id="church"></div>
      </div>
      <div class="body">
        <img class="qr" src="/api/qr" alt="QR code">
        <div>
          <h1>Sent? Døren låst?<span class="en">Late? Door locked?</span></h1>
          <p class="sub">Skann koden, så kommer noen ned.<br>Scan and someone will come down.</p>
        </div>
      </div>
      <div class="foot">
        <span>Ingen internett? · No internet?</span>
        <p class="sub">Ring / Call</p>
        <span class="phone" id="phone"></span>
      </div>
    </main>
  </div>

  <script>
    fetch("/api/status").then((r) => r.json()).then((c) => {
      document.getElementById("church").textContent = c.churchName || "";
      document.getElementById("phone").textContent = c.doorPhone || "";
    });
  </script>
</body>
</html>
